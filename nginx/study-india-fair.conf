limit_req_zone $binary_remote_addr zone=studyindiafair_next_js_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=studyindiafair_api_limit:10m rate=50r/s;

# Only POST requests get a key here; every other method maps to an empty
# string, which nginx ignores (the request is not rate limited at all).
map $request_method $studyindiafair_upload_post_key {
    default "";
    POST    $binary_remote_addr;
}

# Mirror of the above for reads: POST is excluded so an upload never eats
# into the (much larger) budget used for serving images.
map $request_method $studyindiafair_upload_get_key {
    default $binary_remote_addr;
    POST    "";
}

# Writes are expensive (up to 200M bodies + image processing), so keep them tight.
limit_req_zone $studyindiafair_upload_post_key zone=studyindiafair_uploads_post_limit:10m rate=30r/m;

# Reads are cheap and a single page can pull dozens of images.
limit_req_zone $studyindiafair_upload_get_key zone=studyindiafair_uploads_get_limit:10m rate=100r/s;

server {
    listen 80;
    server_name studyindiafair.ommnews.in cms-studyindiafair.ommnews.in api-studyindiafair.ommnews.in upload-studyindiafair.ommnews.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name studyindiafair.ommnews.in;

    # SSL Certificates (Update paths to match your Certbot volume)
    ssl_certificate /etc/letsencrypt/live/studyindiafair.ommnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyindiafair.ommnews.in/privkey.pem;

    # Return 429 (Too Many Requests) when limits are hit
    limit_req_status 429;

    location /uploads/ {
        limit_req zone=studyindiafair_uploads_get_limit burst=200 nodelay;

        proxy_pass http://study_india_fair_upload_1:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. NEXT.JS FRONTEND
    location / {
        # limit_req zone=nextjs_limit burst=30 nodelay;
        limit_req zone=studyindiafair_next_js_limit burst=70 nodelay;
        
        proxy_pass http://study_india_fair_frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name cms-studyindiafair.ommnews.in;

    ssl_certificate /etc/letsencrypt/live/studyindiafair.ommnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyindiafair.ommnews.in/privkey.pem;

    limit_req_status 429;

    location /uploads/ {
        limit_req zone=studyindiafair_uploads_get_limit burst=200 nodelay;

        proxy_pass http://study_india_fair_upload_1:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

   # 2. CRM SERVER
    location / {
        # limit_req zone=nextjs_limit burst=30 nodelay;
        limit_req zone=studyindiafair_next_js_limit burst=70 nodelay;
        
        proxy_pass http://study_india_fair_cms:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api-studyindiafair.ommnews.in;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/studyindiafair.ommnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyindiafair.ommnews.in/privkey.pem;

    location / {
        limit_req zone=studyindiafair_api_limit burst=50 nodelay;  # Apply rate limit here
        proxy_pass http://study_india_fair_api_1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name upload-studyindiafair.ommnews.in;

    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/studyindiafair.ommnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyindiafair.ommnews.in/privkey.pem;

    limit_req_status 429;

    location / {
        # POST only: 30r/m with a burst so a batch upload from the CMS goes through.
        limit_req zone=studyindiafair_uploads_post_limit burst=20 nodelay;
        # Everything else (image reads) gets the loose limit.
        limit_req zone=studyindiafair_uploads_get_limit burst=200 nodelay;

        proxy_pass http://study_india_fair_upload_1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}