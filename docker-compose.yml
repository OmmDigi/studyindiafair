version: "3.8"

services:
  study_india_fair_frontend:
    build: ./frontend
    image: study_india_fair_frontend
    container_name: study_india_fair_frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - study_india_fair_api_1
      - study_india_fair_upload_1
    networks:
      - study_india_fair_network
      - shared_network

  study_india_fair_cms:
    build: ./cms
    container_name: study_india_fair_cms
    image: study_india_fair_cms
    expose:
      - "80"
    env_file:
      - ./cms/.env
    depends_on:
      - study_india_fair_api_1
      - study_india_fair_upload_1
    networks:
      - study_india_fair_network
      - shared_network

  study_india_fair_api_1:
    build: ./api
    container_name: study_india_fair_api_1
    image: study_india_fair_api_1
    expose:
      - "3000"
    env_file:
      - ./api/.env
    environment:
      - NODE_ENV=${NODE_ENV}
      # Set here rather than in ./api/.env so the host name matches the service
      # name on this network. Unset it and the api simply runs without a cache.
      - REDIS_URL=redis://study_india_fair_redis_1:6379
    depends_on:
      - study_india_fair_database_1
      - study_india_fair_redis_1
    volumes:
      - ./logs/api-logs:/app/logs
    networks:
      - study_india_fair_network
      - shared_network

  study_india_fair_upload_1:
    build: ./upload
    container_name: study_india_fair_upload_1
    image: study_india_fair_upload_1
    expose:
      - "3000"
    env_file:
      - ./upload/.env
    environment:
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./uploaded-files/uploads:/app/uploads
      - ./uploaded-files/private:/app/private
    depends_on:
      - study_india_fair_database_1
    networks:
      - study_india_fair_network
      - shared_network

  study_india_fair_redis_1:
    image: redis:7.4-alpine
    container_name: study_india_fair_redis_1
    # Nothing in here is a source of truth, it is all rebuildable from
    # postgres, so persistence is turned off on purpose : no RDB snapshots, no
    # AOF, no volume to keep in sync or restore. A restart just starts cold and
    # the next requests repopulate it.
    #
    # allkeys-lru instead of the default noeviction, because a cache that
    # refuses writes when it fills up is worse than one that drops its coldest
    # entries. Evicting a tag set only costs the entries under it their early
    # invalidation, and they still expire on their own TTL.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    # Deliberately not published to the host : it holds cached storefront
    # responses and has no password, so it stays reachable only from inside the
    # compose network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Only study_india_fair_network : shared_network is external, and an unauthenticated
    # redis has no business being reachable from other stacks on this host.
    # The api is the sole client and it sits on study_india_fair_network too.
    networks:
      - study_india_fair_network

  study_india_fair_database_1:
    image: postgres:17.4-alpine
    container_name: study_india_fair_database_1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - study_india_fair_pg_data:/var/lib/postgresql/data
      - ./backup_tmp:/backup_tmp
    ports:
      - "5433:5432"
    networks:
      - study_india_fair_network

volumes:
  study_india_fair_pg_data:

networks:
  study_india_fair_network:
    driver: bridge
  shared_network:
    external: true
